name: daily-gua

# 每天北京时间 09:00（UTC 01:00）自动生成当日瓜报，并开当日 Issue。
# 手动触发：Actions → daily-gua → Run workflow，可指定日期 / 额外种子 / 强制降级。
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "瓜报日期 YYYY-MM-DD（留空 = 北京今天）"
        required: false
      seed:
        description: "额外种子链接（逗号分隔，可留空）"
        required: false
      no_llm:
        description: "强制降级（仅链接汇总，不调用 LLM）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-gua
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成瓜报（采集 → 打分 → LLM 整理 → 落盘 → 开 Issue）
        env:
          # Secrets：未配置时自动降级，不阻塞出报
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # 发布用：Actions 自动注入，需在仓库设置中开启工作流写权限
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          # 可选调参（仓库 Variables，未设置则用内置默认值）
          X_KEYWORDS: ${{ vars.X_KEYWORDS }}
          X_HANDLES: ${{ vars.X_HANDLES }}
          SEED_URLS: ${{ vars.SEED_URLS }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
          SITE_URL: ${{ vars.SITE_URL }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_SEED: ${{ github.event.inputs.seed }}
          INPUT_NO_LLM: ${{ github.event.inputs.no_llm }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${INPUT_DATE:-}" ]; then
            ARGS+=(--date "$INPUT_DATE")
          fi
          if [ -n "${INPUT_SEED:-}" ]; then
            IFS=',' read -ra SEEDS <<< "$INPUT_SEED"
            for seed in "${SEEDS[@]}"; do
              if [ -n "$seed" ]; then
                ARGS+=(--seed "$seed")
              fi
            done
          fi
          if [ "${INPUT_NO_LLM:-false}" = "true" ]; then
            ARGS+=(--no-llm)
          fi
          python -m src.cli.daily "${ARGS[@]}"

      - name: 提交瓜报与状态
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gua README.md feed.xml state
          if git diff --cached --quiet; then
            echo "本次没有文件变更（可能为重复运行）"
          else
            git commit -m "gua: $(date -u +%F) 每日一瓜"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "推送失败：多次 rebase 重试仍被拒绝" >&2
                exit 1
              fi
              echo "推送被拒（可能与其他流水线并发更新同一分支），rebase 后重试（第 $attempt 次）"
              sleep $((2 ** attempt))
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: 汇总结果
        if: always()
        run: |
          {
            echo "## 🍉 每日一瓜运行结果"
            echo ""
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            ls -la gua | tail -5 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败留痕
        if: failure()
        run: |
          {
            echo "## ❌ 每日一瓜生成失败"
            echo ""
            echo "- 日期：$(date -u +%F)"
            echo "- 排查：查看本运行上方步骤日志；常见原因为 LLM 网关超时 / 采集源全部不可达"
            echo "- 重试：Actions → daily-gua → Run workflow（可加 \`no_llm\` 走降级产出）"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1