name: ci

# 基础 CI：ruff 静态检查 + pytest 单测（全部离线，不依赖 Secrets）。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装开发依赖
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装开发依赖
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q